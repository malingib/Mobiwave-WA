name: Supabase webhook delivery worker

on:
  schedule:
    # GitHub Actions schedules run on the default branch and may be delayed.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobiwave-webhook-worker
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate required secrets exist
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          INTERNAL_FUNCTION_TOKEN: ${{ secrets.INTERNAL_FUNCTION_TOKEN }}
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Missing repository secret SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing repository secret SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          test -n "$INTERNAL_FUNCTION_TOKEN" || { echo "::error::Missing repository secret INTERNAL_FUNCTION_TOKEN"; exit 1; }
      - name: Process due customer webhook deliveries
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          INTERNAL_FUNCTION_TOKEN: ${{ secrets.INTERNAL_FUNCTION_TOKEN }}
        run: |
          set -eu
          base="${SUPABASE_URL%/}"
          curl --silent --show-error --fail-with-body --max-time 45 \
            --request POST "${base}/functions/v1/webhook-worker" \
            --header "Content-Type: application/json" \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "X-Internal-Token: ${INTERNAL_FUNCTION_TOKEN}" \
            --data '{}'
