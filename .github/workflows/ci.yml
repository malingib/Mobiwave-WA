name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mobiwave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d mobiwave_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile end-to-end tests
        env:
          VITE_SUPABASE_URL: https://e2e-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-placeholder-anon-key
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload visual review screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-${{ github.run_number }}
          path: playwright-report/
          if-no-files-found: error
          retention-days: 7
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test outbound idempotency behavior
        run: deno test supabase/functions/api-send/idempotency_test.ts
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Test concurrent idempotency claims against PostgreSQL
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/mobiwave_test
        run: bash .github/scripts/test-outbound-idempotency-postgres.sh
      - name: Type-check Supabase Edge Functions
        run: deno check supabase/functions/*/index.ts
